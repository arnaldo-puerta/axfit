<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AxFit</title>
  <meta name="description" content="Tu plan personal de comida, ejercicio y progreso.">
  <meta name="theme-color" content="#fafafa">
  <script>
    // Aplica el tema antes de pintar para evitar parpadeo.
    try { const t = localStorage.getItem('axfit-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* sin storage */ }
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icons/icon.svg" alt="" width="24" height="24"> AxFit</div>
    <div class="right">
      <div id="topStreak" class="pill streak" title="Racha"></div>
      <button id="themeBtn" class="icon-btn" data-act="cycleTheme" aria-label="Cambiar tema"></button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Secciones">
    <a href="#hoy" data-tab="hoy"><span data-i="home"></span>Hoy</a>
    <a href="#comida" data-tab="comida"><span data-i="utensils"></span>Comida</a>
    <a href="#ejercicio" data-tab="ejercicio"><span data-i="dumbbell"></span>Ejercicio</a>
    <a href="#progreso" data-tab="progreso"><span data-i="trendUp"></span>Progreso</a>
    <a href="#mas" data-tab="mas"><span data-i="sliders"></span>Más</a>
  </nav>

  <div id="modal" class="modal" hidden></div>
  <div id="workout" class="workout" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
